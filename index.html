<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title><style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:#0b0b0b;
color:white;
text-align:center;
overflow:hidden;
}

/* HEART BACKGROUND */

.heart{
position:absolute;
color:#ff4d6d;
font-size:16px;
animation:rise 6s linear infinite;
}

@keyframes rise{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* TAP BOX */

#tap{
background:rgba(255,255,255,0.08);
padding:22px 35px;
border-radius:15px;
cursor:pointer;
box-shadow:0 0 15px #ff4d6d;
transition:0.3s;
}

#tap:hover{
transform:scale(1.05);
}

#tap h2{
font-size:20px;
margin:0;
}

/* MAIN */

#main{
display:none;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:14px;
margin-top:20px;
justify-content:center;
}

.box{
background:rgba(255,255,255,0.1);
padding:14px;
border-radius:10px;
width:75px;
}

.number{
font-size:24px;
font-weight:bold;
}

.label{
font-size:12px;
}

#msg{
margin-top:25px;
font-size:24px;
}

</style></head><body><div id="tap" onclick="start()">
<h2>🎁 Tap For Your Surprise</h2>
</div><div id="main"><h3>⏳ Countdown To Midnight</h3><div class="countdown"><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div id="msg"></div></div><script>

/* HEARTS */

function createHeart(){

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

}

setInterval(createHeart,350);

/* START */

function start(){

document.getElementById("tap").style.display="none";
document.getElementById("main").style.display="block";

let midnight=new Date();
midnight.setHours(24,0,0,0);

let timer=setInterval(function(){

let now=new Date().getTime();
let distance=midnight-now;

let hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((distance%(1000*60*60))/(1000*60));
let seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";

document.getElementById("msg").innerHTML="🎉 Happy Birthday Sriyanka 🎂❤️";

}

},1000);

}

</script></body>
</html>
