<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title><style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;

background:linear-gradient(135deg,#ff758c,#ff7eb3,#8f5cff);
}

/* TAP BOX */

.tapBox{
border:3px solid black;
padding:25px 40px;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.15);
border-radius:12px;
}

/* PAGE 2 */

#page2{
display:none;
flex-direction:column;
align-items:center;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:15px;
margin-top:20px;
}

.box{
background:rgba(255,255,255,0.2);
padding:14px;
border-radius:10px;
width:70px;
}

.number{
font-size:22px;
font-weight:bold;
}

.label{
font-size:12px;
}

/* HEARTS */

.heart{
position:absolute;
color:#ff2e63;
font-size:16px;
animation:rise 6s linear infinite;
}

@keyframes rise{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

#birthdayMsg{
display:none;
font-size:34px;
margin-top:30px;
}

</style></head><body><div id="page1">
<div class="tapBox" onclick="openPage()">
🎁 Tap For Your Surprise
</div>
</div><div id="page2"><h2>⏳ Countdown To Midnight</h2><div class="countdown"><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div id="birthdayMsg">
🎉 Happy Birthday Sriyanka 🫶❤️
</div></div><script>

/* HEARTS */

function heart(){
var h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(function(){h.remove()},6000);
}
setInterval(heart,400);

/* OPEN PAGE */

function openPage(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

var midnight=new Date();
midnight.setHours(24,0,0,0);

var timer=setInterval(function(){

var now=new Date().getTime();
var distance=midnight-now;

var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
var minutes=Math.floor((distance%(1000*60*60))/(1000*60));
var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

if(distance<=0){
clearInterval(timer);
document.querySelector(".countdown").style.display="none";
document.getElementById("birthdayMsg").style.display="block";
}

},1000);

}

/* VERSION UPDATE FIX */

if ('serviceWorker' in navigator) {
navigator.serviceWorker.getRegistrations().then(function(registrations) {
for(let registration of registrations) {
registration.unregister();
}
});
}

</script></body>
</html>
