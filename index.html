<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title><style>

body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
background:linear-gradient(135deg,#ff6a88,#ff99ac,#ffc3a0);
}

/* Tap Screen */

#tapScreen{
font-size:35px;
cursor:pointer;
animation:blink 1.5s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.5;}
100%{opacity:1;}
}

/* Main Section */

#main{
display:none;
}

.container{
background:rgba(0,0,0,0.35);
padding:40px;
border-radius:20px;
}

/* Countdown */

.countdown{
display:flex;
gap:20px;
justify-content:center;
margin-top:20px;
}

.box{
background:rgba(255,255,255,0.2);
padding:20px;
border-radius:15px;
width:90px;
}

.number{
font-size:35px;
font-weight:bold;
}

.label{
font-size:14px;
}

#msg{
margin-top:30px;
font-size:30px;
}

</style></head><body><div id="tapScreen" onclick="startSurprise()">
🎁 Tap for your surprise 🎁
</div><div id="main"><div class="container"><h1>⏳ Countdown Begins ⏳</h1><div class="countdown"><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div id="msg"></div></div></div><script>

function startSurprise(){

document.getElementById("tapScreen").style.display="none";
document.getElementById("main").style.display="block";

var midnight = new Date();
midnight.setHours(24,0,0,0);

var x = setInterval(function(){

var now = new Date().getTime();
var distance = midnight - now;

var hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
var minutes = Math.floor((distance % (1000*60*60))/(1000*60));
var seconds = Math.floor((distance % (1000*60))/1000);

document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

if(distance < 0){

clearInterval(x);

document.querySelector(".countdown").style.display="none";

document.getElementById("msg").innerHTML="🎉 Happy Birthday Sriyanka 🎂✨";

}

},1000);

}

</script></body>
</html>
