<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title><style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
color:white;
overflow:hidden;
background:#111;
}

/* LOVE HEART BACKGROUND */

.heart{
position:absolute;
color:#ff4d6d;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

/* TAP SCREEN */

#tapScreen{
font-size:28px;
cursor:pointer;
padding:20px 40px;
background:#ff4d6d;
border-radius:40px;
box-shadow:0 0 20px #ff4d6d;
}

/* MAIN CONTAINER */

#main{
display:none;
}

.container{
background:rgba(0,0,0,0.6);
padding:35px;
border-radius:20px;
}

/* COUNTDOWN */

.countdown{
display:flex;
gap:18px;
justify-content:center;
margin-top:20px;
}

.box{
background:rgba(255,255,255,0.1);
padding:18px;
border-radius:12px;
width:80px;
}

.number{
font-size:28px;
font-weight:bold;
}

.label{
font-size:14px;
}

#msg{
margin-top:25px;
font-size:28px;
}

</style></head><body><div id="tapScreen" onclick="start()">
🎁 Tap For Your Surprise
</div><div id="main"><div class="container"><h2>⏳ Countdown Begins ⏳</h2><div class="countdown"><div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div><div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div><div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div></div><div id="msg"></div></div></div><script>

/* HEART ANIMATION */

function createHeart(){

var heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(Math.random()*20+15)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},6000);

}

setInterval(createHeart,300);

/* TAP START */

function start(){

document.getElementById("tapScreen").style.display="none";

document.getElementById("main").style.display="block";

var midnight=new Date();

midnight.setHours(24,0,0,0);

var x=setInterval(function(){

var now=new Date().getTime();

var distance=midnight-now;

var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes=Math.floor((distance%(1000*60*60))/(1000*60));

var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("hours").innerHTML=hours;

document.getElementById("minutes").innerHTML=minutes;

document.getElementById("seconds").innerHTML=seconds;

if(distance<0){

clearInterval(x);

document.querySelector(".countdown").style.display="none";

document.getElementById("msg").innerHTML="🎉 Happy Birthday Sriyanka 🎂❤";

}

},1000);

}

</script></body>
</html>
